<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Options menu: a gear. Used on the main menu, Level Select and the pause menu. -->
  <g fill="#ffffff">
    <circle cx="50" cy="50" r="30"/>
    <rect x="43" y="6" width="14" height="20" rx="4"/>
    <rect x="43" y="74" width="14" height="20" rx="4"/>
    <rect x="6" y="43" width="20" height="14" rx="4"/>
    <rect x="74" y="43" width="20" height="14" rx="4"/>
    <rect x="43" y="6" width="14" height="20" rx="4" transform="rotate(45 50 50)"/>
    <rect x="43" y="74" width="14" height="20" rx="4" transform="rotate(45 50 50)"/>
    <rect x="6" y="43" width="20" height="14" rx="4" transform="rotate(45 50 50)"/>
    <rect x="74" y="43" width="20" height="14" rx="4" transform="rotate(45 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="13" fill="#4a4f55"/>
</svg>
