<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bomb Catapult: A-frame launching a fused bomb -- the fused/sparking
       silhouette reads as "explosive," distinct from Wall's plain rock and
       every other block's cooler tool colors (see icon-system.md's
       cool-tool/warm-consequence hue split -- this one leans warm since
       it's a one-shot consumable "consequence" action, not a passive
       redirect). -->
  <g stroke="#1e2530" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 82 L50 30 L80 82 Z" fill="#8a6a4a"/>
    <line x1="50" y1="30" x2="72" y2="50"/>
    <circle cx="72" cy="50" r="14" fill="#2b2f38"/>
    <path d="M72 36 Q78 26 86 22" fill="none" stroke="#e0862c" stroke-width="4"/>
    <circle cx="87" cy="20" r="4" fill="#e0862c" stroke="none"/>
  </g>
</svg>
