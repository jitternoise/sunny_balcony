<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dormant geyser: a sinter mound with a cracked stone cap around a
       dark vent, and two thin wisps of steam leaking out of it. Pale
       purple family -- the geyser's status bar is Color(0.75, 0.35, 0.85)
       and its cell fill Color(0.5, 0.3, 0.6) -- so the player's existing
       colour association holds; the cap is the lightest thing on the
       tile, the vent the darkest, so it reads at 58 px. -->
  <!-- steam wisps, outlined so they hold against the purple fill -->
  <g fill="none" stroke="#3a1f4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 44 C34 36 46 30 39 20"/>
    <path d="M58 42 C66 34 54 27 61 16"/>
  </g>
  <g fill="none" stroke="#f1dcfb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 44 C34 36 46 30 39 20"/>
    <path d="M58 42 C66 34 54 27 61 16"/>
  </g>
  <!-- mound -->
  <path d="M6 86 L24 58 Q50 44 76 58 L94 86 Z"
        fill="#b08fcf" stroke="#3a1f4d" stroke-width="5" stroke-linejoin="round"/>
  <!-- cracks running down the mound -->
  <g fill="none" stroke="#3a1f4d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 66 L31 74 L34 82"/>
    <path d="M64 66 L69 74 L66 82"/>
  </g>
  <!-- stone cap, lighter, sitting on the crest -->
  <ellipse cx="50" cy="56" rx="27" ry="9.5"
           fill="#e2caf4" stroke="#3a1f4d" stroke-width="4.5"/>
  <g fill="none" stroke="#3a1f4d" stroke-width="2.5" stroke-linecap="round">
    <path d="M29 58 L36 55"/>
    <path d="M71 54 L64 57"/>
  </g>
  <!-- vent -->
  <ellipse cx="50" cy="56" rx="11" ry="4.5" fill="#2a1436" stroke="#3a1f4d" stroke-width="2.5"/>
</svg>
