<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Level Select badge: the Hydro Plant's turbine hub as a single white
       glyph. Deliberately heavier than icon_hydro.svg's version -- this is
       drawn at roughly 20px, where the board icon's fine strokes vanish. -->
  <circle cx="50" cy="50" r="21" fill="none" stroke="#ffffff" stroke-width="13"/>
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
    <line x1="50" y1="14" x2="50" y2="27"/>
    <line x1="50" y1="73" x2="50" y2="86"/>
    <line x1="14" y1="50" x2="27" y2="50"/>
    <line x1="73" y1="50" x2="86" y2="50"/>
  </g>
</svg>
