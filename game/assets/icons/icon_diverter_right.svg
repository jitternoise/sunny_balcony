<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Diverter-Right: a plain straight arrow pointing down-right. The bent chevron it
       replaces read as a fold in the path rather than a direction; the exit
       is a single straight push, so the glyph is one straight arrow. -->
  <g stroke="#1e2530" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32.9 23.1
             L62.6 52.7
             L71.1 44.2
             L76.0 76.0
             L44.2 71.1
             L52.7 62.6
             L23.1 32.9
             Z"
          fill="#f7931e"/>
  </g>
</svg>
